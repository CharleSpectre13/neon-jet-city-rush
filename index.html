<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#050814"/>
<title>Neon Jet: City Rush</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#050814;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#e8f0ff;touch-action:none}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;background:#050814}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;background:linear-gradient(180deg,rgba(5,8,20,.75),rgba(5,8,20,.92));z-index:10;text-align:center}
.overlay.hidden{display:none}
h1{font-size:clamp(1.8rem,7vw,2.8rem);font-weight:800;letter-spacing:.04em;background:linear-gradient(90deg,#00f0ff,#7af0ff,#ff2bd6);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.tag{font-size:.85rem;color:#8aa0c8;letter-spacing:.18em;text-transform:uppercase;margin-bottom:24px}
.btn{appearance:none;border:none;min-width:200px;padding:16px 28px;margin:8px;border-radius:16px;font-size:1.05rem;font-weight:700;cursor:pointer;color:#041018;background:linear-gradient(135deg,#00f0ff,#5ef0ff);box-shadow:0 0 24px rgba(0,240,255,.4)}
.btn:active{transform:scale(.96)}
.btn.secondary{background:transparent;color:#00f0ff;border:2px solid rgba(0,240,255,.55);box-shadow:none}
.btn.pink{background:linear-gradient(135deg,#ff2bd6,#ff7ae8);color:#1a0514}
.stats{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.stat{background:rgba(8,14,32,.88);border:1px solid rgba(0,240,255,.2);border-radius:14px;padding:12px 18px;min-width:100px}
.stat b{display:block;font-size:1.35rem;color:#ffd166}
.stat span{font-size:.72rem;color:#8aa0c8;text-transform:uppercase}
.levels{display:grid;grid-template-columns:repeat(5,minmax(48px,1fr));gap:10px;width:min(340px,90vw);margin:12px 0 20px}
.lvl{aspect-ratio:1;border-radius:14px;border:1.5px solid rgba(0,240,255,.35);background:rgba(10,18,40,.9);color:#cfe8ff;font-weight:800;font-size:1.1rem;cursor:pointer}
.lvl.locked{opacity:.35}.lvl.done{border-color:#ffd166}.lvl.active{border-color:#00f0ff;box-shadow:0 0 16px rgba(0,240,255,.45)}
.hint{margin-top:16px;font-size:.9rem;color:#9bb0d0;line-height:1.45;max-width:320px}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;pointer-events:none;z-index:5;font-variant-numeric:tabular-nums}
#hud.hidden{display:none}
.hud-box{background:rgba(8,14,32,.88);border:1px solid rgba(0,240,255,.22);border-radius:12px;padding:8px 12px;font-size:.85rem}
.hud-box strong{color:#ffd166}
#touch-hint{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(200,220,255,.55);font-size:.8rem;pointer-events:none;z-index:5}
#touch-hint.hidden{display:none}
</style></head><body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="hud" class="hidden">
<div class="hud-box">LVL <strong id="h-lvl">1</strong></div>
<div class="hud-box"><strong id="h-dist">0</strong> m · <strong id="h-coins">0</strong> ◆</div>
<div class="hud-box"><strong id="h-best">0</strong> best</div>
</div>
<div id="touch-hint" class="hidden">HOLD to fly · release to fall</div>
<div id="screen-start" class="overlay">
<h1>NEON JET</h1><div class="tag">City Rush</div>
<div class="stats"><div class="stat"><b id="s-best">0</b><span>Best distance</span></div><div class="stat"><b id="s-coins">0</b><span>Total coins</span></div></div>
<p class="hint" style="margin-bottom:16px">Hold to fire thrusters. Dodge lasers, drones & towers across 5 neon districts.</p>
<button class="btn" id="btn-play">PLAY</button>
<button class="btn secondary" id="btn-levels">LEVELS</button>
</div>
<div id="screen-levels" class="overlay hidden">
<h1 style="font-size:1.6rem">DISTRICTS</h1><div class="tag">Pick a level</div>
<div class="levels" id="level-grid"></div>
<button class="btn secondary" id="btn-back">BACK</button>
</div>
<div id="screen-over" class="overlay hidden">
<h1 id="over-title" style="font-size:1.7rem">CRASHED</h1>
<div class="stats"><div class="stat"><b id="o-dist">0</b><span>Distance</span></div><div class="stat"><b id="o-coins">0</b><span>Coins</span></div></div>
<p class="hint" id="over-msg">Keep flying.</p>
<button class="btn" id="btn-retry">RETRY</button>
<button class="btn pink" id="btn-next" style="display:none">NEXT LEVEL</button>
<button class="btn secondary" id="btn-home">HOME</button>
</div>
</div>
<script>
(()=>{"use strict";
const K="neonjet_v1";
const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{best:0,coins:0,unlocked:1}}catch{return{best:0,coins:0,unlocked:1}}};
const save=d=>localStorage.setItem(K,JSON.stringify(d));
let P=load();
const LVL=[
{id:1,name:"Downtown Glow",goal:400,speed:4.2,g:.42,th:.78,sp:1,pal:["#0a1630","#122448","#1a3060"]},
{id:2,name:"Skybridge",goal:550,speed:4.8,g:.44,th:.8,sp:.9,pal:["#081428","#0e2040","#163058"]},
{id:3,name:"Neon Spire",goal:700,speed:5.4,g:.46,th:.82,sp:.8,pal:["#0a1028","#14183a","#1e2050"]},
{id:4,name:"Maglev Yards",goal:900,speed:6,g:.48,th:.84,sp:.7,pal:["#0c0c24","#181838","#24204c"]},
{id:5,name:"Orbit Gate",goal:1200,speed:6.8,g:.5,th:.86,sp:.6,pal:["#0a0820","#160c34","#220e48"]}
];
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2.5);W=innerWidth;H=innerHeight;canvas.width=W*dpr|0;canvas.height=H*dpr|0;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();
const screens={start:document.getElementById("screen-start"),levels:document.getElementById("screen-levels"),over:document.getElementById("screen-over")};
const hud=document.getElementById("hud"),hint=document.getElementById("touch-hint");
function show(n){Object.values(screens).forEach(s=>s.classList.add("hidden"));if(n)screens[n].classList.remove("hidden");hud.classList.toggle("hidden",n!==null);hint.classList.toggle("hidden",n!==null)}
function meta(){document.getElementById("s-best").textContent=P.best|0;document.getElementById("s-coins").textContent=P.coins;document.getElementById("h-best").textContent=P.best|0}
function buildLevels(){const g=document.getElementById("level-grid");g.innerHTML="";LVL.forEach(L=>{const b=document.createElement("button");b.className="lvl";b.textContent=L.id;if(L.id>P.unlocked)b.classList.add("locked");else if(L.id<P.unlocked)b.classList.add("done");else b.classList.add("active");b.onclick=()=>{if(L.id<=P.unlocked)start(L.id-1)};g.appendChild(b)})}
let thrust=false,state="menu",li=0,pl,obs,coins,parts,bld,cld,sx=0,dist=0,rc=0,spd=0,st=0,ct=0,dead=false,won=false,shake=0,flash=0,lastT=0;
const GH=56;
const setT=v=>thrust=v;
canvas.addEventListener("pointerdown",e=>{e.preventDefault();setT(true)});
addEventListener("pointerup",e=>{e.preventDefault();setT(false)});
addEventListener("pointercancel",e=>{e.preventDefault();setT(false)});
addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();setT(true)}});
addEventListener("keyup",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();setT(false)}});
function start(i){li=i;const L=LVL[li];pl={x:W*.22,y:H*.55,vy:0,w:36,h:28,jet:0,ang:0,alive:true};obs=[];coins=[];parts=[];bld=[];cld=[];sx=0;dist=0;rc=0;spd=L.speed;st=80;ct=40;dead=false;won=false;shake=0;flash=0;thrust=false;seed();state="play";show(null);document.getElementById("h-lvl").textContent=L.id;document.getElementById("h-dist").textContent="0";document.getElementById("h-coins").textContent="0";lastT=performance.now();requestAnimationFrame(loop)}
function seed(){let x=-40;while(x<W*2.5){const bw=40+Math.random()*70,bh=80+Math.random()*(H*.45);bld.push({x,w:bw,h:bh,win:3+(Math.random()*5|0),acc:Math.random()>.7});x+=bw+8+Math.random()*30}for(let i=0;i<12;i++)cld.push({x:Math.random()*W*2,y:40+Math.random()*H*.35,w:60+Math.random()*100,sp:.15+Math.random()*.25,a:.04+Math.random()*.06})}
function recycle(){for(const b of bld){if(b.x+b.w<-20){const m=Math.max(...bld.map(o=>o.x+o.w));b.x=m+10+Math.random()*40;b.w=40+Math.random()*70;b.h=80+Math.random()*(H*.45);b.win=3+(Math.random()*5|0);b.acc=Math.random()>.7}}}
function spO(){const r=Math.random(),bx=sx+W+40;if(r<.35){const gy=60+Math.random()*(H-GH-200),gh=90+Math.random()*50;obs.push({t:"laser",x:bx,gy,gh,w:14,pu:0})}else if(r<.6)obs.push({t:"drone",x:bx,y:50+Math.random()*(H-GH-100),w:34,h:18,bob:Math.random()*6.28});else if(r<.8){const h=40+Math.random()*50;obs.push({t:"spike",x:bx,y:H-GH-h,w:28,h})}else{const h=50+Math.random()*70;obs.push({t:"drop",x:bx,y:0,w:26,h})}}
function spC(){const bx=sx+W+20,y=80+Math.random()*(H-GH-160),n=3+(Math.random()*4|0),pat=Math.random();for(let i=0;i<n;i++){let cy=y;if(pat<.33)cy=y+Math.sin(i*.9)*30;else if(pat<.66)cy=y+i*12;coins.push({x:bx+i*28,y:cy,r:8})}}
function burst(x,y,c,n=12){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:20+Math.random()*20,max:40,c,sz:2+Math.random()*3})}}
function trail(){if(!pl.alive)return;parts.push({x:pl.x-8,y:pl.y+pl.h*.55+(Math.random()-.5)*6,vx:-2-Math.random()*2,vy:(Math.random()-.5)*1.5,life:12+Math.random()*10,max:22,c:Math.random()>.5?"#00f0ff":"#ff2bd6",sz:2+Math.random()*2.5})}
function rh(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by}
function cr(cx,cy,r,rx,ry,rw,rh){const nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));const dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r}
function kill(){if(dead)return;dead=true;pl.alive=false;shake=12;flash=1;burst(pl.x+pl.w/2,pl.y+pl.h/2,"#ff3b5c",24);burst(pl.x+pl.w/2,pl.y+pl.h/2,"#00f0ff",12);if(dist>P.best)P.best=dist;save(P);setTimeout(()=>end(false),700)}
function win(){if(won||dead)return;won=true;dead=true;if(dist>P.best)P.best=dist;if(li+1>=P.unlocked)P.unlocked=Math.min(LVL.length,li+2);save(P);burst(pl.x+20,pl.y,"#ffd166",20);setTimeout(()=>end(true),600)}
function end(v){state="over";meta();document.getElementById("over-title").textContent=v?"DISTRICT CLEAR":"CRASHED";document.getElementById("o-dist").textContent=dist|0;document.getElementById("o-coins").textContent=rc;document.getElementById("over-msg").textContent=v?(li>=LVL.length-1?"You cleared the whole skyline.":"Unlocked: "+LVL[Math.min(li+1,LVL.length-1)].name):"Goal was "+LVL[li].goal+" m — try again.";document.getElementById("btn-next").style.display=v&&li<LVL.length-1?"inline-block":"none";show("over")}
function update(dt){if(state!=="play"||!pl)return;const L=LVL[li],t=Math.min(dt,32)/16.67;if(!dead){spd=L.speed+dist*.0012;sx+=spd*t;dist=sx/8;if(thrust){pl.vy-=L.th*t;pl.jet=Math.min(1,pl.jet+.15*t);trail();if(Math.random()>.6)trail()}else{pl.vy+=L.g*t;pl.jet=Math.max(0,pl.jet-.08*t)}pl.vy=Math.max(-9,Math.min(10,pl.vy));pl.y+=pl.vy*t;pl.ang=pl.vy*.04;if(pl.y<8){pl.y=8;pl.vy=0}const fy=H-GH-pl.h;if(pl.y>fy){pl.y=fy;pl.vy=Math.min(0,pl.vy)}st-=t;ct-=t;if(st<=0){spO();st=(50+Math.random()*40)*L.sp}if(ct<=0){spC();ct=55+Math.random()*45}const px=pl.x,py=pl.y,pw=pl.w,ph=pl.h,pad=4;for(let i=obs.length-1;i>=0;i--){const o=obs[i],ox=o.x-sx;if(ox<-80){obs.splice(i,1);continue}if(o.t==="drone"){o.bob+=.08*t;o.dy=o.y+Math.sin(o.bob)*12}let hit=false;if(o.t==="laser"){const by=o.gy+o.gh;if(rh(px+pad,py+pad,pw-pad*2,ph-pad*2,ox,0,o.w,o.gy))hit=true;if(rh(px+pad,py+pad,pw-pad*2,ph-pad*2,ox,by,o.w,H-GH-by))hit=true;o.pu+=.15*t}else if(o.t==="drone"){if(rh(px+pad,py+pad,pw-pad*2,ph-pad*2,ox,o.dy,o.w,o.h))hit=true}else if(rh(px+pad,py+pad,pw-pad*2,ph-pad*2,ox,o.y,o.w,o.h))hit=true;if(hit)kill()}for(let i=coins.length-1;i>=0;i--){const c=coins[i],cx=c.x-sx;if(cx<-40){coins.splice(i,1);continue}if(cr(cx,c.y,c.r,px,py,pw,ph)){rc++;P.coins++;burst(px+pw/2,py+ph/2,"#ffd166",8);coins.splice(i,1);document.getElementById("h-coins").textContent=rc}}for(const b of bld)b.x-=spd*t*.35;recycle();for(const cl of cld){cl.x-=spd*t*cl.sp;if(cl.x+cl.w<0)cl.x=W+Math.random()*100}if(dist>=L.goal)win();document.getElementById("h-dist").textContent=dist|0}else{pl.vy+=.5*t;pl.y+=pl.vy*t;pl.ang+=.15*t}for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*t;p.y+=p.vy*t;p.vy+=.08*t;p.life-=t;if(p.life<=0)parts.splice(i,1)}if(shake>0)shake=Math.max(0,shake-.6*t);if(flash>0)flash=Math.max(0,flash-.05*t)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function dLaser(x,y,w,h,pu){if(h<=0)return;const g=ctx.createLinearGradient(x,y,x+w,y);g.addColorStop(0,"rgba(255,43,214,0)");g.addColorStop(.5,"rgba(255,43,214,"+pu+")");g.addColorStop(1,"rgba(255,43,214,0)");ctx.fillStyle=g;ctx.fillRect(x-4,y,w+8,h);ctx.fillStyle="rgba(255,180,240,"+pu+")";ctx.fillRect(x+w*.3,y,w*.4,h)}
function draw(){const L=LVL[li]||LVL[0];const ox=shake?(Math.random()-.5)*shake:0,oy=shake?(Math.random()-.5)*shake:0;ctx.save();ctx.translate(ox,oy);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,L.pal[2]);g.addColorStop(.55,L.pal[1]);g.addColorStop(1,L.pal[0]);ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);ctx.fillStyle="rgba(180,220,255,.35)";for(let i=0;i<40;i++)ctx.fillRect(((i*97+sx*.02)%(W+20)),(i*53)%(H*.5),1.5,1.5);for(const cl of cld){ctx.fillStyle="rgba(120,160,220,"+cl.a+")";rr(cl.x,cl.y,cl.w,18,10);ctx.fill()}for(const b of bld){ctx.fillStyle="rgba(12,20,48,.95)";ctx.fillRect(b.x,H-GH-b.h,b.w,b.h);ctx.fillStyle=b.acc?"rgba(255,43,214,.55)":"rgba(0,240,255,.35)";ctx.fillRect(b.x,H-GH-b.h,3,b.h);const cols=b.win,rows=Math.max(2,b.h/18|0);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ctx.fillStyle=((sx/30|0)+r+c+(b.x|0))%5!==0?"rgba(255,220,120,.55)":"rgba(40,60,100,.4)";ctx.fillRect(b.x+6+c*((b.w-12)/cols),H-GH-b.h+8+r*16,4,6)}}ctx.fillStyle="#0a1228";ctx.fillRect(0,H-GH,W,GH);ctx.fillStyle="rgba(0,240,255,.5)";ctx.fillRect(0,H-GH,W,3);ctx.fillStyle="rgba(0,240,255,.25)";const d=(sx*.8)%40;for(let x=-d;x<W;x+=40)ctx.fillRect(x,H-GH+14,22,3);for(const c of coins){const x=c.x-sx,pu=1+Math.sin(performance.now()/120+c.x)*.1;ctx.save();ctx.translate(x,c.y);ctx.scale(pu,pu);ctx.fillStyle="#ffd166";ctx.shadowColor="#ffd166";ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(0,-c.r);ctx.lineTo(c.r*.7,0);ctx.lineTo(0,c.r);ctx.lineTo(-c.r*.7,0);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#fff3c4";ctx.beginPath();ctx.arc(0,0,3,0,6.28);ctx.fill();ctx.restore()}for(const o of obs){const x=o.x-sx;if(o.t==="laser"){const pu=.55+Math.sin(o.pu)*.25;dLaser(x,0,o.w,o.gy,pu);dLaser(x,o.gy+o.gh,o.w,H-GH-(o.gy+o.gh),pu);ctx.fillStyle="#ff2bd6";ctx.fillRect(x-4,o.gy-6,o.w+8,6);ctx.fillRect(x-4,o.gy+o.gh,o.w+8,6)}else if(o.t==="drone"){const y=o.dy??o.y;ctx.save();ctx.translate(x+o.w/2,y+o.h/2);ctx.fillStyle="#1a2238";rr(-o.w/2,-o.h/2,o.w,o.h,6);ctx.fill();ctx.strokeStyle="#ff3b5c";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#ff3b5c";ctx.beginPath();ctx.arc(4,0,4,0,6.28);ctx.fill();ctx.restore()}else if(o.t==="spike"){ctx.fillStyle="#1a2238";ctx.fillRect(x,o.y,o.w,o.h);ctx.fillStyle="#ff3b5c";ctx.beginPath();ctx.moveTo(x,o.y);ctx.lineTo(x+o.w/2,o.y-14);ctx.lineTo(x+o.w,o.y);ctx.closePath();ctx.fill()}else{ctx.fillStyle="#1a2238";ctx.fillRect(x,o.y,o.w,o.h);ctx.fillStyle="#ff2bd6";ctx.fillRect(x,o.y+o.h-4,o.w,4);ctx.beginPath();ctx.moveTo(x,o.y+o.h);ctx.lineTo(x+o.w/2,o.y+o.h+14);ctx.lineTo(x+o.w,o.y+o.h);ctx.closePath();ctx.fill()}}for(const p of parts){const a=Math.max(0,p.life/p.max);ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.sz*a,0,6.28);ctx.fill();ctx.globalAlpha=1}if(pl){ctx.save();ctx.translate(pl.x+pl.w/2,pl.y+pl.h/2);ctx.rotate(pl.ang);if(pl.jet>.05){const fl=pl.jet;ctx.fillStyle="rgba(0,240,255,"+(.4+fl*.5)+")";ctx.beginPath();ctx.moveTo(-pl.w/2-2,4);ctx.lineTo(-pl.w/2-10-fl*16,8);ctx.lineTo(-pl.w/2-2,14);ctx.closePath();ctx.fill();ctx.fillStyle="rgba(255,43,214,"+(.35+fl*.4)+")";ctx.beginPath();ctx.moveTo(-pl.w/2,6);ctx.lineTo(-pl.w/2-6-fl*10,9);ctx.lineTo(-pl.w/2,12);ctx.closePath();ctx.fill()}ctx.fillStyle="#d8e6ff";rr(-pl.w/2+4,-pl.h/2+2,pl.w-6,pl.h-4,6);ctx.fill();ctx.fillStyle="#00f0ff";ctx.beginPath();ctx.arc(pl.w/2-8,-4,9,0,6.28);ctx.fill();ctx.fillStyle="rgba(10,20,40,.85)";ctx.beginPath();ctx.arc(pl.w/2-6,-4,5,0,6.28);ctx.fill();ctx.fillStyle="#2a3558";rr(-pl.w/2-2,-8,12,18,4);ctx.fill();ctx.strokeStyle="#00f0ff";ctx.lineWidth=1.5;ctx.stroke();ctx.restore()}if(state==="play"&&!won){const gx=LVL[li].goal*8-sx;if(gx<W+40&&gx>-40){ctx.strokeStyle="rgba(255,209,102,.7)";ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H-GH);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#ffd166";ctx.font="bold 14px system-ui";ctx.fillText("FINISH",gx+8,36)}}if(state==="play"){const pct=Math.min(1,dist/LVL[li].goal);ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(16,H-18,W-32,6);ctx.fillStyle="#00f0ff";ctx.fillRect(16,H-18,(W-32)*pct,6);ctx.fillStyle="#ffd166";ctx.fillRect(16+(W-32)*pct-2,H-20,4,10)}ctx.restore();if(flash>0){ctx.fillStyle="rgba(255,80,120,"+(flash*.35)+")";ctx.fillRect(0,0,W,H)}}
function loop(now){if(state!=="play")return;const dt=now-lastT;lastT=now;update(dt);draw();requestAnimationFrame(loop)}
